; PlatformIO Project Configuration File
; For ESP32 Dev Module (compatible with Arduino IDE settings)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Upload settings (same as Arduino IDE)
upload_port = COM3
; For Linux/Mac use: /dev/ttyUSB0 or /dev/tty.usbserial-*
; For Windows use: COM3, COM4, etc.

upload_speed = 921600
upload_protocol = esptool

; Serial monitor settings
monitor_speed = 115200
monitor_port = COM3

; Required libraries
lib_deps =
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.6

; Build flags - DHT11 by default
build_flags =
    -D DHTTYPE=DHT11
    ; For DHT22, uncomment the line below:
    ; -D DHTTYPE=DHT22
